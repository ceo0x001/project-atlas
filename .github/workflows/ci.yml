name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two roles, matching production posture: the app runs as `atlas_app` (subject to
  # row-level security), migrations as the owner. The RLS migration creates the app
  # role, so this URL only works after `migrate deploy`.
  DATABASE_URL: postgresql://atlas_app:atlas_app@localhost:5432/atlas?schema=public
  DATABASE_MIGRATION_URL: postgresql://atlas:atlas@localhost:5432/atlas?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Must be the pgvector image: the schema declares the extension, so a plain
        # postgres image fails the migration rather than the tests.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      # format -> lint -> typecheck -> test. Lint is where the money and module
      # boundary invariants are enforced, so a violation fails the build here.
      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      # Applies the schema *and* the row-level security policies, which are appended
      # into the migration itself so no environment can come up without them.
      - name: Apply migrations
        run: pnpm --filter @atlas/api exec prisma migrate deploy

      # Proves the compiled SQL executes and that tenant isolation holds when
      # reached through application code — not just in the unit assertions.
      - name: Integration tests
        run: pnpm --filter @atlas/api run test:integration

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # analyze and test need neither the android/ scaffolding nor a JDK.
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
