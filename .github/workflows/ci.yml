name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma requires the variable to be present to read the schema. No database is
  # contacted in this job; a Postgres service arrives with M1's repository tests.
  DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      # format -> lint -> typecheck -> test. Lint is where the money and module
      # boundary invariants are enforced, so a violation fails the build here.
      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # analyze and test need neither the android/ scaffolding nor a JDK.
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
